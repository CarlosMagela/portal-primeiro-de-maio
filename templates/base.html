{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block titulo %}
        A.D. Primeiro de Maio
        {% endblock %}
    </title>

    <meta name="description" content="Portal Oficial da Associação Desportiva Primeiro de Maio">

    <meta name="keywords" content="Primeiro de Maio, Barueri, Futebol, Clube, História, Maião">

    <meta name="author" content="Carlos Eduardo Magela">

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'css/hero.css' %}">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">

    <link rel="icon" href="{% static 'img/escudo.png' %}">

</head>

<body>

    {% include 'includes/navbar.html' %}

    <main>

        {% block conteudo %}
        {% endblock %}

    </main>

    {% include 'includes/footer.html' %}

    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->

    <script src="{% static 'js/main.js' %}"></script>

</body>

</html>
